name: 1 · Données du jour

# 02:17 UTC = 4h17 l'été, 3h17 l'hiver à Genève — bien avant la rédaction (5h37).
# Minute « bizarre » exprès : GitHub retarde ou saute souvent les tâches prévues à l'heure pile.
# Filet de sécurité : la rédaction pousse requests/data-AAAA-MM-JJ si le fichier manque, ce qui relance ce workflow.
on:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main]
    paths: ['requests/data-*']
  workflow_dispatch:
    inputs:
      date:
        description: 'Date à préparer (AAAA-MM-JJ), vide = aujourd''hui. Ex. un samedi pour tester les sorties.'
        required: false

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Date demandée
        id: d
        run: |
          D="${{ inputs.date }}"
          if [ -z "$D" ] && [ "${{ github.event_name }}" = "push" ]; then
            D=$(ls requests/ 2>/dev/null | sed -n 's#^data-\([0-9-]*\)$#\1#p' | sort | tail -1)
          fi
          echo "date=$D" >> "$GITHUB_OUTPUT"
      - run: npm run data -- ${{ steps.d.outputs.date && format('--date={0}', steps.d.outputs.date) || '' }}
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          OPENAGENDA_KEY: ${{ secrets.OPENAGENDA_KEY }}
      - name: Commit des données
        run: |
          git config user.name "matinale-bot"
          git config user.email "matinale-bot@users.noreply.github.com"
          git add data/
          D="${{ steps.d.outputs.date }}"; [ -n "$D" ] || D=$(TZ=Europe/Zurich date +%F)
          git rm -q --ignore-unmatch "requests/data-$D" || true
          git diff --cached --quiet || git commit -m "data: $D"
          git pull --rebase -q origin main
          git push
