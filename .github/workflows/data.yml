name: 1 · Données du jour

# 03:00 UTC = 5h00 l'été, 4h00 l'hiver à Genève — avant la rédaction (5h37).
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date à préparer (AAAA-MM-JJ), vide = aujourd''hui. Ex. un samedi pour tester les sorties.'
        required: false

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data -- ${{ inputs.date && format('--date={0}', inputs.date) || '' }}
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          OPENAGENDA_KEY: ${{ secrets.OPENAGENDA_KEY }}
      - name: Commit des données
        run: |
          git config user.name "matinale-bot"
          git config user.email "matinale-bot@users.noreply.github.com"
          git add data/
          D="${{ inputs.date }}"; [ -n "$D" ] || D=$(TZ=Europe/Zurich date +%F)
          git diff --cached --quiet || git commit -m "data: $D"
          git push
